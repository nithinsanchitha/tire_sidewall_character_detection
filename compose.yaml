services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /app/data
      OCR_MODEL_DIR: /app/models/easyocr
      HF_HOME: /app/models/huggingface
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - tire-data:/app/data
      - tire-models:/app/models
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
  ollama:
    image: ollama/ollama:0.11.11
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
volumes:
  tire-data:
  tire-models:
  ollama-models:
