server {
 listen 80;
 server_name _;
 client_max_body_size 13m;
 access_log off;
 location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 180s; }
 location = /health { proxy_pass http://backend:8000/health; }
}
